<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <title>Practice Pal</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5f9; color: #0f172a; }
    main { width: min(92vw, 540px); padding: 42px 30px; background: white; border-radius: 24px; box-shadow: 0 16px 50px #0f172a15; text-align: center; }
    .logo { font-size: 3rem; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 6vw, 3rem); }
    p { line-height: 1.6; color: #475569; }
    .pill { display: inline-block; padding: 8px 14px; border-radius: 999px; background: #dbeafe; color: #1d4ed8; font-weight: 700; font-size: .85rem; }
    button { margin-top: 18px; border: 0; border-radius: 12px; padding: 12px 18px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #f8fafc; }
      main { background: #1e293b; }
      p { color: #cbd5e1; }
      .pill { background: #1e3a8a; color: #bfdbfe; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">🎵</div>
    <span class="pill">Our first website</span>
    <h1>Practice Pal</h1>
    <p>Every minute of music practice counts. Track your progress, build good habits, and celebrate your achievements.</p>
    <p><strong>We're building something great!</strong></p>
    <button type="button" onclick="alert('Practice tracking is coming in the next steps!')">Get started</button>
  </main>
</body>
</html>
